version: '3.9'

services:
  # 🟦 Base de datos PostgreSQL
  c10na_db:
    image: postgres:17.2
    container_name: c10na_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: c10na
      POSTGRES_PASSWORD: c10na
      POSTGRES_DB: c10na_db
    volumes:
      - pgdata_c10na:/var/lib/postgresql/data
    networks:
      - c10na_network

  # 🟩 pgAdmin4 (interfaz visual)
  c10na_pgadmin:
    image: dpage/pgadmin4
    container_name: c10na_pgadmin
    restart: unless-stopped
    depends_on:
      - c10na_db
    ports:
      - "8080:80"              # Abre pgAdmin en http://localhost:8080
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@c10na.com
      PGADMIN_DEFAULT_PASSWORD: c10na
    volumes:
      - pgadmin_c10na:/var/lib/pgadmin
    networks:
      - c10na_network

# 🔸 Volúmenes para persistir datos
volumes:
  pgdata_c10na:
  pgadmin_c10na:

# 🔹 Red interna para que ambos se comuniquen
networks:
  c10na_network:
    driver: bridge
